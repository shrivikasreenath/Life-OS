[package]
name = "life-os"
version = "1.0.0"
edition = "2021"
authors = ["Shrivika"]
description = "Life OS — An autonomous, bare-metal Rust operating system"

[dependencies]
limine = "0.5.0"
x86_64 = { version = "0.14.12", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
spin = { version = "0.9.8", default-features = false, features = ["spin_mutex", "rwlock"] }
volatile = "0.4.6"
bitflags = "2.4"
linked_list_allocator = "0.10.6"
pic8259 = "0.11.0"
pc-keyboard = "0.9.0"
smoltcp = { version = "0.11", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-igmp",
    "proto-dhcpv4",
    "proto-dns",
    "socket-raw",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
    "async"
] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
